<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AURA AI</title>

<style>
*{box-sizing:border-box}

:root{
  --black:#000;
  --panel:#080808;
  --panel2:#111;
  --border:#252525;
  --white:#fff;
  --muted:#888;
  --blue:#1677ff;
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:#050505;
  border-right:1px solid #222;
  padding:14px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:24px;
  font-weight:800;
  padding:10px 6px 18px;
}

.logo span{
  color:var(--blue);
}

.new-chat{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #303030;
  background:#111;
  color:white;
  cursor:pointer;
  text-align:left;
}

.new-chat:hover{
  background:#181818;
}

.history-title{
  margin:20px 6px 8px;
  color:#666;
  font-size:11px;
  letter-spacing:.5px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  display:flex;
  gap:7px;
  align-items:center;
  padding:10px;
  margin:3px 0;
  border-radius:8px;
  color:#bbb;
  cursor:pointer;
  font-size:13px;
}

.history-item:hover{
  background:#151515;
}

.history-name{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.creator{
  border-top:1px solid #222;
  padding:15px 5px 5px;
  text-align:center;
  color:#777;
  font-size:11px;
  line-height:1.6;
}

.creator strong{
  color:white;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  border-bottom:1px solid #222;
  background:#050505;
  display:flex;
  align-items:center;
  padding:0 18px;
}

.menu{
  display:none;
  border:0;
  background:none;
  color:white;
  font-size:22px;
  margin-right:12px;
}

.top-title{
  font-weight:bold;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:30px 15px 150px;
}

.welcome{
  max-width:800px;
  margin:14vh auto 0;
  text-align:center;
}

.welcome h1{
  font-size:45px;
  margin:0 0 12px;
}

.welcome h1 span{
  color:var(--blue);
}

.welcome p{
  color:#888;
}

.welcome-creator{
  margin-top:30px;
  color:#777;
  font-size:13px;
}

.welcome-creator strong{
  color:white;
}

/* MESSAGE */

.message{
  max-width:900px;
  margin:20px auto;
  display:flex;
  gap:11px;
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.avatar{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:50%;
  background:#141414;
  border:1px solid #292929;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.user .avatar{
  order:2;
}

.content{
  max-width:78%;
  display:flex;
  flex-direction:column;
}

.bubble{
  padding:12px 15px;
  border-radius:15px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:var(--blue);
  border-bottom-right-radius:5px;
}

.ai .bubble{
  background:#101010;
  border:1px solid #252525;
  border-bottom-left-radius:5px;
}

.message-image{
  max-width:280px;
  max-height:300px;
  object-fit:contain;
  border-radius:12px;
  margin-top:5px;
  border:1px solid #292929;
}

.generated-image{
  max-width:min(600px,100%);
  border-radius:14px;
  border:1px solid #292929;
  margin-top:5px;
}

.tools{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.tool{
  background:#080808;
  border:1px solid #292929;
  color:#999;
  padding:5px 8px;
  border-radius:7px;
  cursor:pointer;
  font-size:11px;
}

.tool:hover{
  color:white;
}

/* COMPOSER */

.composer-area{
  position:fixed;
  left:270px;
  right:0;
  bottom:0;
  padding:15px;
  background:linear-gradient(transparent,#000 35%);
}

.composer{
  max-width:900px;
  margin:auto;
}

.preview{
  display:none;
  align-items:center;
  gap:9px;
  background:#111;
  border:1px solid #292929;
  border-radius:10px;
  padding:8px;
  margin-bottom:8px;
}

.preview img{
  width:52px;
  height:52px;
  border-radius:7px;
  object-fit:cover;
}

.preview-name{
  color:#bbb;
  font-size:12px;
}

.remove{
  margin-left:auto;
  background:none;
  border:0;
  color:#888;
  cursor:pointer;
}

form{
  display:flex;
  align-items:flex-end;
  gap:4px;
  padding:7px;
  background:#0d0d0d;
  border:1px solid #303030;
  border-radius:16px;
}

.icon{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#aaa;
  border-radius:10px;
  cursor:pointer;
  font-size:19px;
}

.icon:hover{
  background:#181818;
  color:white;
}

textarea{
  flex:1;
  min-height:42px;
  max-height:140px;
  resize:none;
  outline:0;
  border:0;
  background:transparent;
  color:white;
  font-size:15px;
  padding:11px 5px;
}

textarea::placeholder{
  color:#666;
}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:white;
  font-size:19px;
  cursor:pointer;
}

.send:disabled{
  opacity:.5;
}

.file{
  display:none;
}

@media(max-width:750px){

  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    bottom:0;
    z-index:20;
    transition:.2s;
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  .composer-area{
    left:0;
  }

  .welcome h1{
    font-size:34px;
  }

  .content{
    max-width:82%;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="logo">
    ✦ <span>AURA</span> AI
  </div>

  <button class="new-chat" id="newChat">
    ＋ New Chat
  </button>

  <div class="history-title">CHAT HISTORY</div>

  <div class="history" id="history"></div>

  <div class="creator">
    <strong>AURA AI</strong><br>
    Created &amp; Developed by<br>
    <strong>YUVRAJ SINGH RATHORE</strong><br><br>
    Powered by OpenAI technology
  </div>

</aside>

<main class="main">

<header class="topbar">

  <button class="menu" id="menu">☰</button>

  <div class="top-title">AURA AI</div>

</header>

<section class="chat" id="chat">

  <div class="welcome">

    <h1>✨ Hello, I'm <span>AURA</span></h1>

    <p>What are we working on today?</p>

    <div class="welcome-creator">
      Created &amp; Developed by
      <strong>YUVRAJ SINGH RATHORE</strong>
    </div>

  </div>

</section>

</main>

<div class="composer-area">

<div class="composer">

  <div class="preview" id="preview">

    <img id="previewImg">

    <span class="preview-name" id="previewName">
      Image
    </span>

    <button class="remove" id="remove">✕</button>

  </div>

  <form id="form">

    <input
      id="file"
      class="file"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <button
      class="icon"
      id="camera"
      type="button"
      title="Add photo"
    >📷</button>

    <button
      class="icon"
      id="mic"
      type="button"
      title="Voice input"
    >🎤</button>

    <textarea
      id="input"
      rows="1"
      placeholder="Message AURA..."
    ></textarea>

    <button
      class="send"
      id="send"
      type="submit"
    >↑</button>

  </form>

</div>

</div>

</div>

<script>

const form=document.getElementById("form");
const input=document.getElementById("input");
const chat=document.getElementById("chat");
const send=document.getElementById("send");

const historyBox=document.getElementById("history");
const newChat=document.getElementById("newChat");

const file=document.getElementById("file");
const camera=document.getElementById("camera");
const preview=document.getElementById("preview");
const previewImg=document.getElementById("previewImg");
const previewName=document.getElementById("previewName");
const remove=document.getElementById("remove");

const mic=document.getElementById("mic");
const menu=document.getElementById("menu");
const sidebar=document.getElementById("sidebar");

let chats=JSON.parse(
  localStorage.getItem("aura_chats") || "[]"
);

let memory=JSON.parse(
  localStorage.getItem("aura_memory") || "{}"
);

let currentId=null;
let messages=[];
let selectedImage=null;


/* MEMORY */

function saveMemory(){
  localStorage.setItem(
    "aura_memory",
    JSON.stringify(memory)
  );
}

function updateMemory(text){

  const match=text.match(
    /(?:my name is|mera naam)\s+([a-zA-Z ]+)/i
  );

  if(match){
    memory.name=match[1].trim();
    saveMemory();
  }

  if(/call me\s+/i.test(text)){

    const m=text.match(
      /call me\s+([a-zA-Z ]+)/i
    );

    if(m){
      memory.name=m[1].trim();
      saveMemory();
    }

  }

  if(/mujhe\s+(.+?)\s+keh ke bulao/i.test(text)){

    const m=text.match(
      /mujhe\s+(.+?)\s+keh ke bulao/i
    );

    if(m){
      memory.name=m[1].trim();
      saveMemory();
    }
  }
}


/* STORAGE */

function saveAll(){
  localStorage.setItem(
    "aura_chats",
    JSON.stringify(chats)
  );
}

function makeId(){
  return Date.now().toString(36)+
    Math.random().toString(36).slice(2);
}

function getTitle(){

  const first=messages.find(
    x=>x.role==="user"
  );

  return first
    ? first.content.slice(0,35)
    : "New Chat";
}


/* HISTORY */

function saveCurrent(){

  if(!currentId){

    currentId=makeId();

    chats.push({
      id:currentId,
      title:"New Chat",
      pinned:false,
      messages:[],
      updatedAt:Date.now()
    });
  }

  const c=chats.find(
    x=>x.id===currentId
  );

  if(!c)return;

  c.messages=messages;
  c.title=getTitle();
  c.updatedAt=Date.now();

  saveAll();
  renderHistory();
}

function renderHistory(){

  historyBox.innerHTML="";

  const list=[...chats].sort(
    (a,b)=>{
      if(a.pinned!==b.pinned)
        return a.pinned ? -1:1;

      return b.updatedAt-a.updatedAt;
    }
  );

  list.forEach(c=>{

    const row=document.createElement("div");

    row.className="history-item";

    const pin=document.createElement("span");
    pin.textContent=c.pinned?"📌":"";

    const name=document.createElement("div");
    name.className="history-name";
    name.textContent=c.title;

    const del=document.createElement("span");
    del.textContent="×";
    del.style.color="#777";

    row.append(pin,name,del);

    row.onclick=e=>{

      if(e.target===del){

        chats=chats.filter(
          x=>x.id!==c.id
        );

        if(currentId===c.id){

          currentId=null;
          messages=[];
          renderChat();
        }

        saveAll();
        renderHistory();
        return;
      }

      if(e.target===pin){

        c.pinned=!c.pinned;
        saveAll();
        renderHistory();
        return;
      }

      currentId=c.id;
      messages=c.messages||[];

      renderChat();
      sidebar.classList.remove("open");
    };

    historyBox.appendChild(row);
  });
}


/* CHAT UI */

function renderChat(){

  chat.innerHTML="";

  if(messages.length===0){

    chat.innerHTML=`
      <div class="welcome">
        <h1>✨ Hello, I'm <span>AURA</span></h1>
        <p>What are we working on today?</p>
        <div class="welcome-creator">
          Created &amp; Developed by
          <strong>YUVRAJ SINGH RATHORE</strong>
        </div>
      </div>
    `;

    return;
  }

  messages.forEach((m,index)=>{

    const row=document.createElement("div");

    row.className=
      "message "+
      (m.role==="user"?"user":"ai");

    const avatar=document.createElement("div");

    avatar.className="avatar";
    avatar.textContent=
      m.role==="user"?"U":"✦";

    const content=document.createElement("div");
    content.className="content";

    if(m.image){

      const image=document.createElement("img");

      image.className=
        m.generated
        ? "generated-image"
        : "message-image";

      image.src=m.image;

      content.appendChild(image);
    }

    if(m.content){

      const bubble=document.createElement("div");

      bubble.className="bubble";
      bubble.textContent=m.content;

      content.appendChild(bubble);
    }

    if(m.role==="assistant"){

      const tools=document.createElement("div");

      tools.className="tools";

      const copy=document.createElement("button");
      copy.className="tool";
      copy.textContent="Copy";

      copy.onclick=()=>{
        navigator.clipboard.writeText(
          m.content||""
        );
      };

      const regen=document.createElement("button");
      regen.className="tool";
      regen.textContent="Regenerate";

      regen.onclick=()=>{
        regenerate(index);
      };

      const share=document.createElement("button");
      share.className="tool";
      share.textContent="Share";

      share.onclick=shareChat;

      tools.append(copy,regen,share);

      content.appendChild(tools);
    }

    row.append(avatar,content);
    chat.appendChild(row);
  });

  chat.scrollTop=chat.scrollHeight;
}


/* SEND */

async function sendMessage(text,imageData=null){

  updateMemory(text);

  if(!currentId){

    currentId=makeId();

    chats.push({
      id:currentId,
      title:"New Chat",
      pinned:false,
      messages:[],
      updatedAt:Date.now()
    });
  }

  messages.push({
    role:"user",
    content:text,
    image:imageData
  });

  renderChat();

  send.disabled=true;

  messages.push({
    role:"assistant",
    content:"Thinking..."
  });

  renderChat();

  const aiIndex=messages.length-1;

  try{

    const response=await fetch(
      "/api/chat",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          messages:messages
            .slice(0,-1)
            .map(m=>({
              role:m.role,
              content:m.content
            })),
          image:imageData
        })
      }
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(
        data.error||"Request failed"
      );
    }

    messages[aiIndex].content=
      data.reply||"";

    if(data.image){
      messages[aiIndex].image=
        data.image;

      messages[aiIndex].generated=true;
    }

  }catch(error){

    messages[aiIndex].content=
      "Sorry, something went wrong.\n"+
      error.message;
  }

  send.disabled=false;

  saveCurrent();
  renderChat();
}


/* FORM */

form.addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    const text=input.value.trim();

    if(!text && !selectedImage)
      return;

    input.value="";

    let imageData=null;

    if(selectedImage){
      imageData=
        await fileToDataURL(
          selectedImage
        );
    }

    clearImage();

    await sendMessage(
      text,
      imageData
    );
  }
);


/* IMAGE */

function fileToDataURL(f){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();

      reader.onload=()=>{
        resolve(reader.result);
      };

      reader.onerror=reject;

      reader.readAsDataURL(f);
    }
  );
}

camera.onclick=()=>{
  file.click();
};

file.onchange=()=>{

  const f=file.files[0];

  if(!f)return;

  selectedImage=f;

  previewName.textContent=f.name;

  const reader=
    new FileReader();

  reader.onload=e=>{
    previewImg.src=e.target.result;
  };

  reader.readAsDataURL(f);

  preview.style.display="flex";
};

function clearImage(){

  selectedImage=null;
  file.value="";
  previewImg.src="";
  preview.style.display="none";
}

remove.onclick=clearImage;


/* MIC */

let recognition=null;

if(
  "SpeechRecognition" in window ||
  "webkitSpeechRecognition" in window
){

  const SR=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;

  recognition=new SR();

  recognition.lang="en-IN";
  recognition.interimResults=false;

  recognition.onstart=()=>{
    mic.textContent="🔴";
  };

  recognition.onend=()=>{
    mic.textContent="🎤";
  };

  recognition.onresult=e=>{

    const spoken=
      e.results[0][0].transcript;

    input.value +=
      (input.value?" ":"")+
      spoken;
  };

  mic.onclick=()=>{

    try{
      recognition.start();
    }catch(e){}
  };

}else{

  mic.onclick=()=>{
    alert(
      "Voice input is not supported in this browser."
    );
  };
}


/* REGENERATE */

function regenerate(index){

  if(index<1)return;

  const previous=
    messages[index-1];

  if(!previous ||
     previous.role!=="user")
    return;

  messages=messages.slice(0,index);

  renderChat();

  sendMessage(
    previous.content,
    previous.image||null
  );
}


/* SHARE */

async function shareChat(){

  let text="AURA AI CHAT\n\n";

  messages.forEach(m=>{

    text+=
      (m.role==="user"
        ?"You: "
        :"AURA: ")+
      (m.content||"")+
      "\n\n";
  });

  if(navigator.share){

    try{

      await navigator.share({
        title:"AURA AI Chat",
        text:text
      });

    }catch(e){}

  }else{

    await navigator.clipboard.writeText(text);

    alert("Chat copied.");
  }
}


/* NEW CHAT */

newChat.onclick=()=>{

  currentId=null;
  messages=[];

  clearImage();

  renderChat();
  renderHistory();

  input.focus();
};


/* MENU */

menu.onclick=()=>{
  sidebar.classList.toggle("open");
};


/* ENTER */

input.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();
      form.requestSubmit();
    }
  }
);


/* START */

renderHistory();
renderChat();

</script>

</body>
</html>
