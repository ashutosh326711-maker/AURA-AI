<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AURA AI</title>

<meta name="description"
content="AURA AI — an AI assistant powered by OpenAI technology and developed by Yuvraj Singh Rathore.">

<style>
*{box-sizing:border-box}

:root{
  --bg:#000;
  --panel:#0b0b0b;
  --panel2:#111;
  --border:#242424;
  --text:#fff;
  --muted:#8d8d8d;
  --blue:#1677ff;
  --blue2:#0d5ed7;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  height:100vh;
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
}

.sidebar{
  width:270px;
  background:#050505;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:14px;
  transition:.2s;
}

.brand{
  font-size:23px;
  font-weight:800;
  padding:10px 8px 18px;
}

.brand span{
  color:var(--blue);
}

.new-chat{
  border:1px solid #303030;
  background:#111;
  color:#fff;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  font-size:14px;
  text-align:left;
}

.new-chat:hover{
  background:#191919;
}

.history-title{
  color:#777;
  font-size:12px;
  margin:20px 7px 8px;
  text-transform:uppercase;
}

.history{
  flex:1;
  overflow:auto;
}

.history-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
  margin-bottom:4px;
  border-radius:8px;
  cursor:pointer;
  color:#ccc;
  font-size:13px;
}

.history-item:hover{
  background:#151515;
}

.history-item.active{
  background:#151515;
  color:#fff;
}

.history-name{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.pin{
  color:#1680ff;
}

.delete-history{
  color:#777;
  cursor:pointer;
}

.delete-history:hover{
  color:#fff;
}

.creator{
  border-top:1px solid #222;
  padding:15px 5px 5px;
  text-align:center;
  color:#777;
  font-size:11px;
  line-height:1.5;
}

.creator strong{
  color:#fff;
}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#050505;
}

.mobile-menu{
  display:none;
  margin-right:12px;
  background:none;
  color:#fff;
  border:0;
  font-size:22px;
}

.top-title{
  font-weight:700;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:25px 15px 155px;
}

.welcome{
  max-width:760px;
  margin:15vh auto 0;
  text-align:center;
}

.welcome h1{
  font-size:46px;
  margin:0 0 12px;
}

.welcome h1 span{
  color:var(--blue);
}

.welcome p{
  color:#888;
}

.message{
  max-width:850px;
  margin:20px auto;
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.avatar{
  width:38px;
  min-width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#161616;
  border:1px solid #292929;
  font-weight:bold;
}

.user .avatar{
  background:#151515;
}

.ai .avatar{
  color:#1680ff;
}

.bubble{
  max-width:calc(100% - 50px);
  padding:12px 15px;
  border-radius:13px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#151515;
}

.ai .bubble{
  background:#0d0d0d;
  border:1px solid #1d1d1d;
}

.message-tools{
  margin-top:7px;
  display:flex;
  gap:7px;
}

.small-btn{
  border:1px solid #292929;
  background:#090909;
  color:#aaa;
  border-radius:7px;
  padding:5px 8px;
  cursor:pointer;
  font-size:11px;
}

.small-btn:hover{
  color:#fff;
  border-color:#444;
}

.composer-wrap{
  position:fixed;
  left:270px;
  right:0;
  bottom:0;
  padding:15px;
  background:linear-gradient(transparent,#000 35%);
}

.composer{
  max-width:850px;
  margin:auto;
}

.attachment-preview{
  display:none;
  background:#111;
  border:1px solid #292929;
  border-radius:10px;
  padding:8px;
  margin-bottom:8px;
  align-items:center;
  gap:10px;
}

.attachment-preview img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:7px;
}

.remove-photo{
  margin-left:auto;
  border:0;
  background:none;
  color:#aaa;
  cursor:pointer;
}

form{
  display:flex;
  align-items:flex-end;
  gap:7px;
  background:#0d0d0d;
  border:1px solid #303030;
  border-radius:15px;
  padding:8px;
}

.icon-btn{
  width:43px;
  height:43px;
  border:0;
  background:transparent;
  color:#aaa;
  border-radius:10px;
  cursor:pointer;
  font-size:19px;
}

.icon-btn:hover{
  color:#fff;
  background:#191919;
}

textarea{
  flex:1;
  min-height:43px;
  max-height:140px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:11px 5px;
  font-size:15px;
}

textarea::placeholder{
  color:#666;
}

.send{
  width:43px;
  height:43px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  cursor:pointer;
  font-size:20px;
}

.send:hover{
  background:var(--blue2);
}

.send:disabled{
  opacity:.5;
}

.file-input{
  display:none;
}

@media(max-width:750px){

  .sidebar{
    position:fixed;
    z-index:10;
    left:-280px;
    top:0;
    bottom:0;
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
  }

  .composer-wrap{
    left:0;
  }

  .welcome h1{
    font-size:34px;
  }

  .message{
    max-width:100%;
  }

}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="brand">
    ✦ <span>AURA</span> AI
  </div>

  <button class="new-chat" id="newChat">
    ＋ New Chat
  </button>

  <div class="history-title">History</div>

  <div class="history" id="history"></div>

  <div class="creator">
    AURA AI<br>
    Developed by <strong>Yuvraj Singh Rathore</strong><br>
    Powered by OpenAI technology
  </div>

</aside>

<main class="main">

  <header class="topbar">

    <button class="mobile-menu" id="menuBtn">☰</button>

    <div class="top-title">AURA AI</div>

  </header>

  <section class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>✨ Hello, I'm <span>AURA</span></h1>
      <p>
        Ask me anything — maths, writing, coding, study and more.
      </p>
    </div>

  </section>

</main>

<div class="composer-wrap">

  <div class="composer">

    <div class="attachment-preview" id="attachmentPreview">

      <img id="previewImage" src="" alt="Selected image">

      <span id="photoName">Image selected</span>

      <button class="remove-photo" id="removePhoto">✕</button>

    </div>

    <form id="form">

      <input
        class="file-input"
        type="file"
        id="photoInput"
        accept="image/*"
      >

      <button
        type="button"
        class="icon-btn"
        id="photoBtn"
        title="Add photo"
      >📷</button>

      <button
        type="button"
        class="icon-btn"
        id="micBtn"
        title="Voice input"
      >🎤</button>

      <textarea
        id="input"
        placeholder="Message AURA AI..."
        rows="1"
      ></textarea>

      <button
        class="send"
        id="send"
        type="submit"
      >↑</button>

    </form>

  </div>

</div>

</div>

<script>

const form = document.getElementById("form");
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const send = document.getElementById("send");
const historyBox = document.getElementById("history");
const newChatBtn = document.getElementById("newChat");

const photoInput = document.getElementById("photoInput");
const photoBtn = document.getElementById("photoBtn");
const attachmentPreview = document.getElementById("attachmentPreview");
const previewImage = document.getElementById("previewImage");
const photoName = document.getElementById("photoName");
const removePhoto = document.getElementById("removePhoto");

const micBtn = document.getElementById("micBtn");
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");

let chats = JSON.parse(localStorage.getItem("aura_chats") || "[]");
let currentChatId = null;
let messages = [];
let selectedImage = null;

function saveChats(){
  localStorage.setItem("aura_chats",JSON.stringify(chats));
}

function makeId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function getTitle(){
  const first = messages.find(x=>x.role==="user");
  if(!first) return "New Chat";
  return first.content.slice(0,32) || "New Chat";
}

function renderHistory(){

  historyBox.innerHTML="";

  const sorted=[...chats].sort((a,b)=>{
    if(a.pinned!==b.pinned) return a.pinned ? -1 : 1;
    return b.updatedAt-a.updatedAt;
  });

  sorted.forEach(item=>{

    const row=document.createElement("div");
    row.className="history-item"+
      (item.id===currentChatId ? " active":"");

    const pin=document.createElement("span");
    pin.textContent=item.pinned ? "📌":"";

    const name=document.createElement("div");
    name.className="history-name";
    name.textContent=item.title;

    const del=document.createElement("span");
    del.className="delete-history";
    del.textContent="×";

    row.appendChild(pin);
    row.appendChild(name);
    row.appendChild(del);

    row.addEventListener("click",(e)=>{

      if(e.target===del){

        e.stopPropagation();

        chats=chats.filter(x=>x.id!==item.id);

        if(currentChatId===item.id){
          currentChatId=null;
          messages=[];
          renderChat();
        }

        saveChats();
        renderHistory();
        return;
      }

      if(e.target===pin){

        e.stopPropagation();

        item.pinned=!item.pinned;
        saveChats();
        renderHistory();
        return;
      }

      loadChat(item.id);

    });

    historyBox.appendChild(row);

  });

}

function renderChat(){

  chat.innerHTML="";

  if(messages.length===0){

    const welcome=document.createElement("div");

    welcome.className="welcome";
    welcome.id="welcome";

    welcome.innerHTML=
      "<h1>✨ Hello, I'm <span>AURA</span></h1>"+
      "<p>Ask me anything — maths, writing, coding, study and more.</p>";

    chat.appendChild(welcome);
    return;
  }

  messages.forEach((msg,index)=>{

    const message=document.createElement("div");

    message.className="message "+(
      msg.role==="user" ? "user":"ai"
    );

    const avatar=document.createElement("div");

    avatar.className="avatar";
    avatar.textContent=
      msg.role==="user" ? "U":"✦";

    const area=document.createElement("div");

    const bubble=document.createElement("div");

    bubble.className="bubble";
    bubble.textContent=msg.content;

    area.appendChild(bubble);

    if(msg.role==="assistant"){

      const tools=document.createElement("div");

      tools.className="message-tools";

      const copy=document.createElement("button");

      copy.className="small-btn";
      copy.textContent="Copy";

      copy.onclick=()=>{
        navigator.clipboard.writeText(msg.content);
        copy.textContent="Copied";
        setTimeout(()=>copy.textContent="Copy",1200);
      };

      const regen=document.createElement("button");

      regen.className="small-btn";
      regen.textContent="Regenerate";

      regen.onclick=()=>regenerate(index);

      tools.appendChild(copy);
      tools.appendChild(regen);

      area.appendChild(tools);
    }

    message.appendChild(avatar);
    message.appendChild(area);

    chat.appendChild(message);

  });

  chat.scrollTop=chat.scrollHeight;

}

function createChatIfNeeded(){

  if(currentChatId) return;

  currentChatId=makeId();

  chats.push({
    id:currentChatId,
    title:"New Chat",
    pinned:false,
    messages:[],
    updatedAt:Date.now()
  });

}

function saveCurrentChat(){

  createChatIfNeeded();

  const item=chats.find(x=>x.id===currentChatId);

  if(!item) return;

  item.messages=messages;
  item.title=getTitle();
  item.updatedAt=Date.now();

  saveChats();
  renderHistory();

}

function loadChat(id){

  const item=chats.find(x=>x.id===id);

  if(!item) return;

  currentChatId=id;
  messages=item.messages || [];

  renderChat();
  renderHistory();

  sidebar.classList.remove("open");

}

newChatBtn.addEventListener("click",()=>{

  currentChatId=null;
  messages=[];
  selectedImage=null;

  clearPhoto();
  renderChat();
  renderHistory();

  input.focus();

});

function addMessage(role,text){

  messages.push({
    role:role,
    content:text
  });

  renderChat();

}

async function sendMessage(text){

  createChatIfNeeded();

  messages.push({
    role:"user",
    content:text
  });

  renderChat();

  send.disabled=true;

  messages.push({
    role:"assistant",
    content:"Thinking..."
  });

  renderChat();

  const aiIndex=messages.length-1;

  try{

    const response=await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        messages:messages.slice(0,-1)
      })

    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error || "Request failed");
    }

    messages[aiIndex].content=data.reply;

  }catch(error){

    messages[aiIndex].content=
      "Sorry, an error occurred: "+
      error.message;

  }finally{

    send.disabled=false;

    saveCurrentChat();
    renderChat();

    input.focus();

  }

}

form.addEventListener("submit",async(e)=>{

  e.preventDefault();

  const text=input.value.trim();

  if(!text && !selectedImage) return;

  input.value="";

  if(selectedImage){

    const imageText=
      text
      ? text+"\n\n[Image attached: "+selectedImage.name+"]"
      : "[Image attached: "+selectedImage.name+"]";

    clearPhoto();

    await sendMessage(imageText);

  }else{

    await sendMessage(text);

  }

});

function regenerate(index){

  if(index<1) return;

  const previous=messages[index-1];

  if(!previous || previous.role!=="user") return;

  messages=messages.slice(0,index);

  renderChat();

  sendMessage(previous.content);

}

photoBtn.addEventListener("click",()=>{
  photoInput.click();
});

photoInput.addEventListener("change",()=>{

  const file=photoInput.files[0];

  if(!file) return;

  selectedImage=file;

  const reader=new FileReader();

  reader.onload=(e)=>{
    previewImage.src=e.target.result;
  };

  reader.readAsDataURL(file);

  photoName.textContent=file.name;
  attachmentPreview.style.display="flex";

});

function clearPhoto(){

  selectedImage=null;
  photoInput.value="";
  previewImage.src="";
  attachmentPreview.style.display="none";

}

removePhoto.addEventListener("click",clearPhoto);

let recognition=null;

if("webkitSpeechRecognition" in window ||
   "SpeechRecognition" in window){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition=new SpeechRecognition();

  recognition.lang="en-IN";
  recognition.interimResults=false;

  recognition.onresult=(event)=>{

    input.value+=
      (input.value ? " ":"")+
      event.results[0][0].transcript;

  };

  recognition.onend=()=>{
    micBtn.textContent="🎤";
  };

  micBtn.addEventListener("click",()=>{

    try{
      recognition.start();
      micBtn.textContent="🔴";
    }catch(e){}

  });

}else{

  micBtn.addEventListener("click",()=>{
    alert("Voice input is not supported by this browser.");
  });

}

menuBtn.addEventListener("click",()=>{
  sidebar.classList.toggle("open");
});

input.addEventListener("keydown",(e)=>{

  if(e.key==="Enter" && !e.shiftKey){

    e.preventDefault();

    form.requestSubmit();

  }

});

renderHistory();
renderChat();

</script>

</body>
</html>
