<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AURA AI</title>

<meta name="description"
content="AURA AI — AI assistant developed by Yuvraj Singh Rathore.">

<style>
*{box-sizing:border-box}

:root{
  --bg:#000;
  --panel:#090909;
  --panel2:#111;
  --border:#252525;
  --text:#fff;
  --muted:#888;
  --blue:#1677ff;
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:#050505;
  border-right:1px solid #222;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:24px;
  font-weight:800;
  padding:10px 5px 18px;
}

.logo span{
  color:#1677ff;
}

.newChat{
  background:#111;
  color:#fff;
  border:1px solid #303030;
  border-radius:10px;
  padding:12px;
  text-align:left;
  cursor:pointer;
}

.newChat:hover{
  background:#181818;
}

.historyTitle{
  margin:20px 5px 8px;
  color:#777;
  font-size:12px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.historyItem{
  padding:10px;
  border-radius:8px;
  color:#ccc;
  cursor:pointer;
  display:flex;
  gap:8px;
  align-items:center;
  font-size:13px;
}

.historyItem:hover{
  background:#151515;
}

.historyName{
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.creator{
  text-align:center;
  border-top:1px solid #222;
  padding:18px 5px 5px;
  color:#777;
  font-size:11px;
  line-height:1.6;
}

.creator strong{
  color:#fff;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  border-bottom:1px solid #222;
  background:#050505;
  display:flex;
  align-items:center;
  padding:0 18px;
}

.topTitle{
  font-weight:bold;
}

.menu{
  display:none;
  background:none;
  border:0;
  color:white;
  font-size:22px;
  margin-right:12px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:30px 15px 155px;
}

.welcome{
  max-width:750px;
  margin:14vh auto 0;
  text-align:center;
}

.welcome h1{
  font-size:45px;
  margin-bottom:12px;
}

.welcome h1 span{
  color:#1677ff;
}

.welcome p{
  color:#888;
}

.welcomeCreator{
  margin-top:28px;
  color:#888;
  font-size:13px;
}

.welcomeCreator strong{
  color:#fff;
}

/* MESSAGES */

.message{
  max-width:900px;
  margin:20px auto;
  display:flex;
  gap:12px;
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.avatar{
  width:37px;
  height:37px;
  min-width:37px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#151515;
  border:1px solid #292929;
  font-weight:bold;
}

.message.user .avatar{
  order:2;
}

.message.user .content{
  order:1;
  align-items:flex-end;
}

.message.ai .content{
  align-items:flex-start;
}

.content{
  display:flex;
  flex-direction:column;
  max-width:78%;
}

.bubble{
  padding:12px 15px;
  border-radius:15px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#1677ff;
  color:white;
  border-bottom-right-radius:5px;
}

.ai .bubble{
  background:#111;
  border:1px solid #242424;
  border-bottom-left-radius:5px;
}

.tools{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.tool{
  background:#080808;
  border:1px solid #292929;
  color:#999;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  cursor:pointer;
}

.tool:hover{
  color:white;
}

/* COMPOSER */

.composerArea{
  position:fixed;
  bottom:0;
  left:270px;
  right:0;
  padding:15px;
  background:linear-gradient(transparent,#000 35%);
}

.composer{
  max-width:900px;
  margin:auto;
}

.preview{
  display:none;
  align-items:center;
  gap:10px;
  background:#111;
  border:1px solid #292929;
  border-radius:10px;
  padding:8px;
  margin-bottom:8px;
}

.preview img{
  width:55px;
  height:55px;
  border-radius:8px;
  object-fit:cover;
}

.previewName{
  color:#ccc;
  font-size:13px;
}

.remove{
  margin-left:auto;
  border:0;
  background:none;
  color:#888;
  cursor:pointer;
  font-size:17px;
}

form{
  display:flex;
  align-items:flex-end;
  gap:5px;
  padding:8px;
  background:#0d0d0d;
  border:1px solid #303030;
  border-radius:16px;
}

.icon{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#aaa;
  border-radius:10px;
  cursor:pointer;
  font-size:19px;
}

.icon:hover{
  background:#191919;
  color:white;
}

textarea{
  flex:1;
  min-height:42px;
  max-height:140px;
  resize:none;
  outline:0;
  border:0;
  background:transparent;
  color:white;
  font-size:15px;
  padding:11px 5px;
}

textarea::placeholder{
  color:#666;
}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  background:#1677ff;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.send:disabled{
  opacity:.5;
}

.file{
  display:none;
}

/* MOBILE */

@media(max-width:750px){

  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    bottom:0;
    z-index:20;
    transition:.2s;
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  .composerArea{
    left:0;
  }

  .welcome h1{
    font-size:34px;
  }

  .content{
    max-width:82%;
  }

}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="logo">
    ✦ <span>AURA</span> AI
  </div>

  <button class="newChat" id="newChat">
    ＋ New Chat
  </button>

  <div class="historyTitle">
    CHAT HISTORY
  </div>

  <div class="history" id="history"></div>

  <div class="creator">
    <strong>AURA AI</strong><br>
    Created &amp; Developed by<br>
    <strong>YUVRAJ SINGH RATHORE</strong><br><br>
    Powered by OpenAI technology
  </div>

</aside>

<main class="main">

<header class="topbar">

  <button class="menu" id="menu">☰</button>

  <div class="topTitle">
    AURA AI
  </div>

</header>

<section class="chat" id="chat">

  <div class="welcome" id="welcome">

    <h1>
      ✨ Hello, I'm <span>AURA</span>
    </h1>

    <p>
      Batao bhai, kya help chahiye?
    </p>

    <div class="welcomeCreator">
      Created &amp; Developed by
      <strong>YUVRAJ SINGH RATHORE</strong>
    </div>

  </div>

</section>

</main>

<div class="composerArea">

<div class="composer">

  <div class="preview" id="preview">

    <img id="previewImg">

    <div class="previewName" id="previewName">
      Image selected
    </div>

    <button class="remove" id="remove">
      ✕
    </button>

  </div>

  <form id="form">

    <input
      type="file"
      id="file"
      class="file"
      accept="image/*"
      capture="environment"
    >

    <button
      type="button"
      class="icon"
      id="camera"
      title="Camera / Photo"
    >
      📷
    </button>

    <button
      type="button"
      class="icon"
      id="mic"
      title="Voice"
    >
      🎤
    </button>

    <textarea
      id="input"
      rows="1"
      placeholder="Batao bhai..."
    ></textarea>

    <button
      class="send"
      id="send"
      type="submit"
    >
      ↑
    </button>

  </form>

</div>

</div>

</div>

<script>

const form=document.getElementById("form");
const input=document.getElementById("input");
const chat=document.getElementById("chat");
const send=document.getElementById("send");

const historyBox=document.getElementById("history");
const newChat=document.getElementById("newChat");

const file=document.getElementById("file");
const camera=document.getElementById("camera");
const preview=document.getElementById("preview");
const previewImg=document.getElementById("previewImg");
const previewName=document.getElementById("previewName");
const remove=document.getElementById("remove");

const mic=document.getElementById("mic");

const menu=document.getElementById("menu");
const sidebar=document.getElementById("sidebar");

let chats=JSON.parse(
  localStorage.getItem("aura_chats") || "[]"
);

let currentId=null;
let messages=[];
let selectedImage=null;


/* STORAGE */

function saveAll(){
  localStorage.setItem(
    "aura_chats",
    JSON.stringify(chats)
  );
}

function id(){
  return Date.now().toString(36)+
         Math.random().toString(36).slice(2);
}


/* HISTORY */

function title(){

  const first=messages.find(
    x=>x.role==="user"
  );

  if(!first) return "New Chat";

  return first.content.slice(0,35);
}

function saveCurrent(){

  if(!currentId){

    currentId=id();

    chats.push({
      id:currentId,
      title:"New Chat",
      pinned:false,
      messages:[],
      updatedAt:Date.now()
    });

  }

  const c=chats.find(x=>x.id===currentId);

  if(!c)return;

  c.messages=messages;
  c.title=title();
  c.updatedAt=Date.now();

  saveAll();
  renderHistory();

}

function renderHistory(){

  historyBox.innerHTML="";

  const sorted=[...chats].sort(
    (a,b)=>{
      if(a.pinned!==b.pinned)
        return a.pinned ? -1:1;

      return b.updatedAt-a.updatedAt;
    }
  );

  sorted.forEach(c=>{

    const row=document.createElement("div");

    row.className="historyItem";

    const pin=document.createElement("span");

    pin.textContent=c.pinned?"📌":"";

    const name=document.createElement("div");

    name.className="historyName";
    name.textContent=c.title;

    const del=document.createElement("span");

    del.textContent="×";
    del.style.color="#777";

    row.appendChild(pin);
    row.appendChild(name);
    row.appendChild(del);

    row.onclick=e=>{

      if(e.target===del){

        chats=chats.filter(
          x=>x.id!==c.id
        );

        if(currentId===c.id){
          currentId=null;
          messages=[];
          renderChat();
        }

        saveAll();
        renderHistory();
        return;
      }

      if(e.target===pin){

        c.pinned=!c.pinned;
        saveAll();
        renderHistory();
        return;
      }

      currentId=c.id;
      messages=c.messages || [];

      renderChat();

      sidebar.classList.remove("open");

    };

    historyBox.appendChild(row);

  });

}


/* CHAT */

function renderChat(){

  chat.innerHTML="";

  if(messages.length===0){

    const w=document.createElement("div");

    w.className="welcome";

    w.innerHTML=`
      <h1>✨ Hello, I'm <span>AURA</span></h1>
      <p>Batao bhai, kya help chahiye?</p>
      <div class="welcomeCreator">
        Created &amp; Developed by
        <strong>YUVRAJ SINGH RATHORE</strong>
      </div>
    `;

    chat.appendChild(w);

    return;
  }

  messages.forEach((m,index)=>{

    const row=document.createElement("div");

    row.className=
      "message "+
      (m.role==="user"?"user":"ai");

    const avatar=document.createElement("div");

    avatar.className="avatar";

    avatar.textContent=
      m.role==="user"?"U":"✦";

    const content=document.createElement("div");

    content.className="content";

    const bubble=document.createElement("div");

    bubble.className="bubble";
    bubble.textContent=m.content;

    content.appendChild(bubble);

    if(m.role==="assistant"){

      const tools=document.createElement("div");

      tools.className="tools";

      const copy=document.createElement("button");

      copy.className="tool";
      copy.textContent="Copy";

      copy.onclick=()=>{
        navigator.clipboard.writeText(m.content);
        copy.textContent="Copied";
        setTimeout(
          ()=>copy.textContent="Copy",
          1200
        );
      };

      const regen=document.createElement("button");

      regen.className="tool";
      regen.textContent="Regenerate";

      regen.onclick=()=>{
        regenerate(index);
      };

      const share=document.createElement("button");

      share.className="tool";
      share.textContent="Share";

      share.onclick=()=>shareChat();

      tools.appendChild(copy);
      tools.appendChild(regen);
      tools.appendChild(share);

      content.appendChild(tools);

    }

    row.appendChild(avatar);
    row.appendChild(content);

    chat.appendChild(row);

  });

  chat.scrollTop=chat.scrollHeight;

}


/* SEND */

async function sendMessage(text){

  if(!currentId){

    currentId=id();

    chats.push({
      id:currentId,
      title:"New Chat",
      pinned:false,
      messages:[],
      updatedAt:Date.now()
    });

  }

  messages.push({
    role:"user",
    content:text
  });

  renderChat();

  send.disabled=true;

  messages.push({
    role:"assistant",
    content:"Soch raha hoon..."
  });

  renderChat();

  const aiIndex=messages.length-1;

  try{

    const response=await fetch(
      "/api/chat",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          messages:messages.slice(0,-1)
        })
      }
    );

    const data=await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Request failed"
      );

    }

    messages[aiIndex].content=
      data.reply;

  }catch(error){

    messages[aiIndex].content=
      "Bhai, abhi ek problem aa gayi: "+
      error.message;

  }

  send.disabled=false;

  saveCurrent();
  renderChat();

}


/* FORM */

form.addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    const text=input.value.trim();

    if(!text && !selectedImage)
      return;

    input.value="";

    if(selectedImage){

      const imageMessage=
        text+
        "\n\n[Photo attached: "+
        selectedImage.name+
        "]";

      clearImage();

      await sendMessage(
        imageMessage
      );

    }else{

      await sendMessage(text);

    }

  }
);


/* NEW CHAT */

newChat.onclick=()=>{

  currentId=null;
  messages=[];

  clearImage();

  renderChat();
  renderHistory();

  input.focus();

};


/* PHOTO / CAMERA */

camera.onclick=()=>{
  file.click();
};

file.onchange=()=>{

  const f=file.files[0];

  if(!f)return;

  selectedImage=f;

  previewName.textContent=f.name;

  const reader=
    new FileReader();

  reader.onload=e=>{
    previewImg.src=e.target.result;
  };

  reader.readAsDataURL(f);

  preview.style.display="flex";

};

function clearImage(){

  selectedImage=null;
  file.value="";
  previewImg.src="";
  preview.style.display="none";

}

remove.onclick=clearImage;


/* MIC */

let recognition=null;

if(
  "SpeechRecognition" in window ||
  "webkitSpeechRecognition" in window
){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition=
    new SpeechRecognition();

  recognition.lang="en-IN";

  recognition.interimResults=false;

  recognition.onstart=()=>{
    mic.textContent="🔴";
  };

  recognition.onend=()=>{
    mic.textContent="🎤";
  };

  recognition.onresult=e=>{

    const text=
      e.results[0][0].transcript;

    input.value+=
      (input.value?" ":"")+
      text;

  };

  mic.onclick=()=>{

    try{
      recognition.start();
    }catch(e){}

  };

}else{

  mic.onclick=()=>{
    alert(
      "Bhai, is browser mein voice input support nahi hai."
    );
  };

}


/* REGENERATE */

function regenerate(index){

  if(index<1)return;

  const previous=
    messages[index-1];

  if(!previous ||
     previous.role!=="user")
    return;

  messages=
    messages.slice(0,index);

  renderChat();

  sendMessage(
    previous.content
  );

}


/* SHARE */

async function shareChat(){

  let text="AURA AI CHAT\n\n";

  messages.forEach(m=>{

    text+=
      (m.role==="user"
        ?"You: "
        :"AURA: ")+
      m.content+
      "\n\n";

  });

  if(navigator.share){

    try{

      await navigator.share({
        title:"AURA AI Chat",
        text:text
      });

    }catch(e){}

  }else{

    await navigator.clipboard.writeText(text);

    alert(
      "Chat copy ho gaya. Ab jahan chaho paste/share kar do."
    );

  }

}


/* MOBILE MENU */

menu.onclick=()=>{
  sidebar.classList.toggle("open");
};


/* ENTER */

input.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      form.requestSubmit();

    }

  }
);


/* START */

renderHistory();
renderChat();

</script>

</body>
</html>
